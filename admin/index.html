<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F3 Vegetables Admin Login</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-page">
    <main class="login-page">
      <section class="login-card">
        <img src="../assets/f3-logo.png" alt="F3 Vegetables logo" />
        <p>Owner access</p>
        <h1>Login to F3 Admin</h1>
        <span>Manage orders, update status, and publish daily offer slides.</span>

        <label>
          Username
          <input id="username" autocomplete="username" placeholder="Enter username" />
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" />
        </label>
        <button id="loginButton" type="button">Login</button>
        <small id="loginMessage"></small>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
